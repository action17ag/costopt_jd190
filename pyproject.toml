[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "action17ag-costopt_jd190"
version = "0.1.0"
description = "按结构键把条目聚类，标出推理成本优化顾问·检索召回的漏斗分析上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "action17ag" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://action17ag.github.io"
Repository = "https://github.com/action17ag/costopt_jd190"
Issues = "https://github.com/action17ag/costopt_jd190/issues"

[project.scripts]
costopt_jd190 = "costopt_jd190:main"

[tool.setuptools]
py-modules = ["costopt_jd190"]
